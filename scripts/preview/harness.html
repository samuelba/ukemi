<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --vscode-font-family: system-ui, 'Ubuntu', sans-serif;
        --vscode-font-size: 13px;
        --vscode-editor-font-family: 'Ubuntu Mono', 'DejaVu Sans Mono', monospace;
        --vscode-editor-font-size: 13px;
        --vscode-foreground: #cccccc;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-errorForeground: #f85149;
        --vscode-icon-foreground: #cccccc;
        --vscode-sideBar-background: #181818;
        --vscode-editor-background: #1f1f1f;
        --vscode-editorWidget-background: #202020;
        --vscode-sideBarSectionHeader-background: #181818;
        --vscode-sideBarSectionHeader-border: #2b2b2b;
        --vscode-widget-border: #313131;
        --vscode-list-hoverBackground: #2a2d2e;
        --vscode-list-inactiveSelectionBackground: #37373d;
        --vscode-list-activeSelectionBackground: #04395e;
        --vscode-list-dropBackground: #383b3d;
        --vscode-toolbar-hoverBackground: #5a5d5e50;
        --vscode-badge-background: #616161;
        --vscode-badge-foreground: #f8f8f8;
        --vscode-button-background: #0078d4;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #026ec1;
        --vscode-button-secondaryBackground: #313131;
        --vscode-button-secondaryForeground: #cccccc;
        --vscode-dropdown-background: #313131;
        --vscode-dropdown-foreground: #cccccc;
        --vscode-dropdown-border: #3c3c3c;
        --vscode-input-background: #313131;
        --vscode-input-foreground: #cccccc;
        --vscode-input-border: #3c3c3c;
        --vscode-focusBorder: #0078d4;
        --vscode-diffEditor-insertedLineBackground: #9bb95533;
        --vscode-diffEditor-removedLineBackground: #ff000033;
        --vscode-gitDecoration-addedResourceForeground: #81b88b;
        --vscode-gitDecoration-modifiedResourceForeground: #e2c08d;
        --vscode-gitDecoration-deletedResourceForeground: #c74e39;
        --vscode-gitDecoration-renamedResourceForeground: #73c991;
        --vscode-gitDecoration-conflictingResourceForeground: #e4676b;
      }
      :root:has(body.vscode-light) {
        --vscode-foreground: #3b3b3b;
        --vscode-descriptionForeground: #6f6f6f;
        --vscode-icon-foreground: #424242;
        --vscode-sideBar-background: #f8f8f8;
        --vscode-editor-background: #ffffff;
        --vscode-editorWidget-background: #f8f8f8;
        --vscode-sideBarSectionHeader-background: #f8f8f8;
        --vscode-sideBarSectionHeader-border: #e5e5e5;
        --vscode-widget-border: #e5e5e5;
        --vscode-list-hoverBackground: #f2f2f2;
        --vscode-list-inactiveSelectionBackground: #e4e6f1;
        --vscode-list-activeSelectionBackground: #e8e8e8;
        --vscode-list-dropBackground: #d6ebff;
        --vscode-toolbar-hoverBackground: #b8b8b850;
        --vscode-badge-background: #cccccc;
        --vscode-badge-foreground: #3b3b3b;
        --vscode-button-secondaryBackground: #e5e5e5;
        --vscode-button-secondaryForeground: #3b3b3b;
        --vscode-dropdown-background: #ffffff;
        --vscode-dropdown-foreground: #3b3b3b;
        --vscode-dropdown-border: #cecece;
        --vscode-input-background: #ffffff;
        --vscode-input-foreground: #3b3b3b;
        --vscode-input-border: #cecece;
        --vscode-gitDecoration-addedResourceForeground: #587c0c;
        --vscode-gitDecoration-modifiedResourceForeground: #895503;
        --vscode-gitDecoration-deletedResourceForeground: #ad0707;
      }
      html:has(body.vscode-dark) {
        background: #181818;
      }
      html:has(body.vscode-light) {
        background: #f8f8f8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="state.generated.js"></script>
    <script>
      const params = new URLSearchParams(location.search)
      const view = params.get('view') === 'split' ? 'split' : 'graph'
      const reply =
        view === 'split' ? { type: 'load', request: window.UKEMI_SPLIT } : { type: 'state', state: window.UKEMI_STATE }
      const evolutionReply = (message) => ({
        type: 'evolution',
        repoId: window.UKEMI_STATE.activeRepoId,
        commitId: message.commitId,
        entries: window.UKEMI_EVOLUTION,
      })
      window.acquireVsCodeApi = () => ({
        postMessage: (message) => {
          if (message.type === 'ready') window.postMessage(reply, '*')
          if (message.type === 'loadEvolution') window.postMessage(evolutionReply(message), '*')
        },
        getState: () => undefined,
        setState: () => undefined,
      })
      document.body.className = params.get('theme') === 'light' ? 'vscode-light' : 'vscode-dark'
      const style = document.createElement('link')
      style.rel = 'stylesheet'
      style.href = `../../dist/webview/${view}.css`
      document.head.appendChild(style)
      const script = document.createElement('script')
      script.src = `../../dist/webview/${view}.js`
      document.body.appendChild(script)
      if (params.has('evolution')) {
        setTimeout(() => document.querySelector('[aria-label^="Show evolution"]')?.click(), 500)
      }
      const scroll = Number(params.get('scroll') ?? 0)
      if (scroll > 0) {
        document.documentElement.style.cssText = 'height: 100%; overflow: hidden'
        document.body.style.cssText = 'height: 100%; overflow: auto'
        setTimeout(() => (document.body.scrollTop = scroll), 500)
      }
    </script>
  </body>
</html>
