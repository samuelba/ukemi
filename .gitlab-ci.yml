stages:
  - check
  - package

variables:
  JJ_VERSION: "0.46.0"
  JJ_SHA256: "fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08"

.install-jj: &install-jj
  - curl -fsSL -o /tmp/jj.tar.gz "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
  - echo "${JJ_SHA256}  /tmp/jj.tar.gz" | sha256sum -c -
  - tar -xzf /tmp/jj.tar.gz -C /usr/local/bin ./jj
  - jj --version

.check:
  stage: check
  script:
    - *install-jj
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/

check:ubuntu:
  extends: .check
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl ca-certificates git nodejs npm >/dev/null

check:fedora:
  extends: .check
  image: fedora:41
  before_script:
    - dnf install -y -q curl git nodejs npm tar gzip

package:
  stage: package
  image: node:20-bookworm
  needs: ["check:ubuntu", "check:fedora"]
  script:
    - npm ci
    - npm run package
  artifacts:
    paths:
      - "*.vsix"
