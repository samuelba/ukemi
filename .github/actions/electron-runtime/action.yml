name: Install Electron runtime libraries
description: Install xvfb and the shared libraries VS Code and Electron need on Ubuntu runners.

runs:
  using: composite
  steps:
    - name: Install the libraries that this Ubuntu release offers
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        packages=(
          xvfb libnss3 libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1
          libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libgtk-3-0t64 libgtk-3-0
          libasound2t64 libasound2 libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64
          libatk-bridge2.0-0 libcups2t64 libcups2
        )
        install=()
        for package in "${packages[@]}"; do
          # apt-cache exits with 100 for a name this Ubuntu release does not have, like the old
          # libasound2 on releases with libasound2t64. Such a name is skipped, not an error.
          candidate="$(apt-cache policy "$package" 2>/dev/null | awk '/Candidate:/ { print $2; exit }')" || candidate=''
          if [ -n "$candidate" ] && [ "$candidate" != "(none)" ]; then
            install+=("$package")
          fi
        done
        sudo apt-get install -y "${install[@]}"
