name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JJ_VERSION: '0.46.0'
  JJ_SHA256: fce0271158e665ceb82dc66c5eb95b1728649094e9133074f3b5baece345fc08
  JJ_LATEST_VERSION: '0.47.1'
  JJ_LATEST_SHA256: d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-jj
        with:
          version: ${{ env.JJ_VERSION }}
          sha256: ${{ env.JJ_SHA256 }}
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # The newest jj, for features older releases lack, such as revsets in templates.
  tests-latest-jj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-jj
        with:
          version: ${{ env.JJ_LATEST_VERSION }}
          sha256: ${{ env.JJ_LATEST_SHA256 }}
      - run: npm ci
      - run: npx vitest run test/integration

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-jj
        with:
          version: ${{ env.JJ_VERSION }}
          sha256: ${{ env.JJ_SHA256 }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: ./.github/actions/electron-runtime
      - run: npm ci
      - run: xvfb-run -a node test/e2e/runE2e.mjs

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/setup-jj
        with:
          version: ${{ env.JJ_VERSION }}
          sha256: ${{ env.JJ_SHA256 }}
      - uses: ./.github/actions/electron-runtime
      - run: npm ci
      - run: xvfb-run -a npm run test:desktop
      - name: Package the app without installers
        run: npm run desktop:package:dir
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-test-results
          path: out/desktop-test-results/

  package:
    needs:
      - format
      - lint
      - tests
      - tests-latest-jj
      - e2e
      - desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
