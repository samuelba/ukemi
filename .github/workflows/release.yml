name: Release

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

# Kept here, not read from the checkout: a job's token can change the repository's files, but not
# its workflows. Must match resources/minisign.pub.
env:
  RELEASE_PUBLIC_KEY: RWRGXhU7foXWxTxyz/h4wGJIMU9HSP63yfJ3wEvd5wXuMBYO+BE6gy/i

# release-please makes a draft, and a push only attaches files to it. scripts/sign-release.sh, run
# by the maintainer, signs them with a key CI never sees and publishes the release. That starts
# the jobs that reach users: the extension stores and the website. Both check the signature first,
# because a compromised build job could publish a draft itself.
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Also drops merge commits and rebased copies from the notes of the release pull request.
      - uses: samuelba/actions/release-please@563bf7ae6023a9191920575d554f912a7389a888 # v1.1.0
        id: release
        with:
          # A fine-grained PAT lets CI run on the release pull request. Without it, the release still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  vsix:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Attach the VSIX to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./*.vsix --clobber

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The snap is built on its own, after the rest: electron-builder's snap target deletes
          # chrome-sandbox from the app folder the deb, rpm and tar.gz are made from.
          - os: ubuntu-latest
            targets: --linux AppImage deb rpm flatpak tar.gz
            snap: true
          # No snap: electron-builder has a prebuilt snap template for x64 only. On arm64 it runs
          # `snapcraft snap`, which snapcraft 8 removed. Every other Linux format is built.
          - os: ubuntu-24.04-arm
            targets: --linux AppImage deb rpm flatpak tar.gz
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packaging
      - run: npm ci
      # Unsigned: a macOS or Windows signing certificate costs money every year.
      - run: npm run desktop:package -- ${{ matrix.targets }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Linux'
        run: scripts/check-linux-packages.sh out/desktop-release
      - if: matrix.snap
        run: npx electron-builder --linux snap --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach the installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          shopt -s nullglob
          # install.sh downloads the unpacked app by this name. electron-builder's schema has no
          # tar.gz artifactName, and linux.artifactName would rename the AppImage, snap and flatpak
          # too. Each Linux runner builds one architecture, its own.
          if [ "$RUNNER_OS" = Linux ]; then
            archives=(out/desktop-release/*.tar.gz)
            if [ ${#archives[@]} -ne 1 ]; then
              echo "expected one tar.gz for install.sh, found ${#archives[@]}" >&2
              exit 1
            fi
            case "$RUNNER_ARCH" in
              X64) arch=x64 ;;
              ARM64) arch=arm64 ;;
              *) echo "install.sh has no build for $RUNNER_ARCH" >&2; exit 1 ;;
            esac
            mv -- "${archives[0]}" "out/desktop-release/Ukemi-${TAG#v}-linux-$arch.tar.gz"
          fi
          files=(out/desktop-release/*.{AppImage,deb,rpm,snap,flatpak,tar.gz,dmg,exe})
          if [ ${#files[@]} -eq 0 ]; then
            echo 'no installers were built' >&2
            exit 1
          fi
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${files[@]}" --clobber

  # samuelba.dev/ukemi/install.sh redirects to the latest release's copy, so the script always
  # matches the packages.
  install-script:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Attach install.sh to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" scripts/install.sh --clobber

  ready-to-sign:
    needs: [release-please, vsix, desktop, install-script]
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::Run scripts/sign-release.sh ${{ needs.release-please.outputs.tag_name }} to sign and publish the release."

  # Both stores take a short-lived OIDC token from this job (Trusted Publishing), so it needs
  # id-token. Each store is skipped until it is set up.
  stores:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - &verify-signed-checksums
        name: Verify the signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern SHA256SUMS --pattern SHA256SUMS.minisig
          comment="$(minisign -V -Q -P "$RELEASE_PUBLIC_KEY" -m SHA256SUMS)"
          [ "$comment" = "ukemi ${TAG#v}" ]
      - name: Download the VSIX and check it against the signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.vsix'
          sha256sum --check --ignore-missing --strict SHA256SUMS
          vsix=(./*.vsix)
          [ "${#vsix[@]}" -eq 1 ]
          grep -qF "  ${vsix[0]#./}" SHA256SUMS
      # Azure DevOps retires the personal access tokens it used before on 2026-12-01. --oidc needs
      # vsce 4.1.0 or later.
      - name: Publish to the Visual Studio Marketplace
        if: vars.MARKETPLACE_TRUSTED_PUBLISHING == 'true'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath ./*.vsix
      - name: Publish to Open VSX
        if: vars.OPEN_VSX_TRUSTED_PUBLISHING == 'true'
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing --packagePath ./*.vsix

  # Points the download buttons on samuelba.dev/ukemi at the new installers. sign-release.sh
  # publishes only a complete release, so the site never links to a missing one. Needs a write
  # deploy key of samuelba/samuelba-website in the WEBSITE_DEPLOY_KEY secret, and the
  # WEBSITE_UPDATE variable set to true. Sevalla rebuilds the site on the push.
  website:
    if: github.event_name == 'release' && vars.WEBSITE_UPDATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: ukemi
      - uses: actions/checkout@v7
        with:
          repository: samuelba/samuelba-website
          ref: main
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          path: site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - *verify-signed-checksums
      # GitHub keeps a SHA-256 of every asset, so nothing else needs downloading. Any file that was
      # swapped or added after signing stops the job.
      - name: Check the release's files against the signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '
            .assets[]
            | select(.name | startswith("SHA256SUMS") | not)
            | "\(.digest // "" | ltrimstr("sha256:"))  \(.name)"' | sort >release-assets
          sort SHA256SUMS | diff - release-assets
      - name: Write the release's download links
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node ukemi/scripts/updateWebsiteRelease.mjs \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --out site/src/data/ukemi-release.json
      - name: Push to the website
        working-directory: site
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'the website already has these links'
            exit 0
          fi
          git add src/data/ukemi-release.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: update Ukemi downloads to $TAG"
          git push origin HEAD:main
