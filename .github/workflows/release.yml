name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # A fine-grained PAT lets CI run on the release pull request. Without it, the release still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  dedupe-notes:
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Drop merge commits and stale copies from the release notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # The action's pr output is the pull request JSON, not the number.
          pr=$(gh pr list --state open --base main --label 'autorelease: pending' --json number --jq '.[0].number')
          case "$pr" in
            '' | null | *[!0-9]*)
              printf 'no open release pull request\n' >&2
              exit 1
              ;;
          esac
          script="${RUNNER_TEMP}/dedupeChangelog.ts"
          body="${RUNNER_TEMP}/release-pr-body.md"
          cp scripts/dedupeChangelog.ts "$script"
          gh pr checkout "$pr"
          gh pr view "$pr" --json body --jq .body > "$body"
          cp "$body" "${body}.orig"
          node "$script" \
            --repo "${{ github.repository }}" \
            --changelog CHANGELOG.md \
            --pull-request-body "$body"
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: drop duplicate entries from the changelog"
            git push
          fi
          if ! cmp -s "$body" "${body}.orig"; then
            gh pr edit "$pr" --body-file "$body"
          fi

  vsix:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Both stores take a short-lived OIDC token from this job (Trusted Publishing), so it needs
    # id-token. Job permissions replace the workflow's, so contents stays writable for the release
    # upload. Each store is skipped until it is set up, and the VSIX on the release can be uploaded
    # by hand.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Attach the VSIX to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./*.vsix
      # Azure DevOps retires the personal access tokens it used before on 2026-12-01. --oidc needs
      # vsce 4.1.0 or later.
      - name: Publish to the Visual Studio Marketplace
        if: vars.MARKETPLACE_TRUSTED_PUBLISHING == 'true'
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath ./*.vsix
      - name: Publish to Open VSX
        if: vars.OPEN_VSX_TRUSTED_PUBLISHING == 'true'
        run: npx --yes ovsx@1.3.0 publish --trusted-publishing --packagePath ./*.vsix

  desktop:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packaging
      - run: npm ci
      # Unsigned: a macOS or Windows signing certificate costs money every year.
      - run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach the installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/desktop-release/*.{AppImage,deb,rpm,snap,flatpak,dmg,exe})
          if [ ${#files[@]} -eq 0 ]; then
            echo 'no installers were built' >&2
            exit 1
          fi
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${files[@]}"

  # Points the download buttons on samuelba.dev/ukemi at the new installers. Runs only when every
  # desktop build uploaded its files, so the site never links to a missing one. Needs a write
  # deploy key of samuelba/samuelba-website in the WEBSITE_DEPLOY_KEY secret, and the
  # WEBSITE_UPDATE variable set to true. Sevalla rebuilds the site on the push.
  website:
    needs: [release-please, desktop]
    if: needs.release-please.outputs.release_created == 'true' && vars.WEBSITE_UPDATE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: ukemi
      - uses: actions/checkout@v7
        with:
          repository: samuelba/samuelba-website
          ref: main
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          path: site
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Write the release's download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ukemi/scripts/updateWebsiteRelease.mjs \
            --repo "${{ github.repository }}" \
            --tag "${{ needs.release-please.outputs.tag_name }}" \
            --out site/src/data/ukemi-release.json
      - name: Push to the website
        working-directory: site
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'the website already has these links'
            exit 0
          fi
          git add src/data/ukemi-release.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: update Ukemi downloads to ${{ needs.release-please.outputs.tag_name }}"
          git push origin HEAD:main
